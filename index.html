<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="description" content="每天一點點，讓日文成為你的日常。假名、文法、單字和間隔複習，全部離線也能學。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ことり" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>ことり — Japanese Studio</title>
  </head>
  <body>
    <div class="auth-layer" id="auth-layer" hidden></div>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#today" aria-label="ことり首頁">
          <span class="brand-mark"><span>こ</span></span>
          <span class="brand-word"><b>ことり</b><small>JAPANESE STUDIO</small></span>
        </a>
        <div class="side-caption">你的學習空間</div>
        <nav class="side-nav" id="side-nav" aria-label="主要導覽"></nav>
        <div class="sidebar-bottom">
          <div class="week-card" id="sidebar-progress"></div>
          <button class="side-install" id="install-btn"><span class="install-icon">↧</span><span><b>安裝 ことり</b><small>帶著日文隨身走</small></span><span class="install-arrow">↗</span></button>
          <div class="profile"><span class="profile-avatar">花</span><span class="profile-copy"><b id="profile-name">我的日文旅程</b><small id="profile-level">從第一步開始</small></span><button class="more-btn" id="settings-open" aria-label="開啟設定">···</button></div>
        </div>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <div class="breadcrumb"><span>ことり</span><i>/</i><b id="page-label">今天</b></div>
          <div class="top-actions">
            <label class="search-box" aria-label="搜尋單字"><span>⌕</span><input id="global-search" placeholder="搜尋單字、假名…" autocomplete="off" /><kbd>CTRL K</kbd></label>
            <button class="streak-chip" id="streak-chip"><span>✳</span><b id="streak-value">0</b><small>連續天</small></button>
            <button class="avatar-button" id="top-settings" aria-label="開啟個人設定">花</button>
          </div>
        </header>
        <div class="mobile-brand"><span class="brand-mark"><span>こ</span></span><b>ことり</b><button id="mobile-install" aria-label="安裝應用程式">↓</button></div>
        <section class="content" id="content" aria-live="polite"></section>
        <footer class="footer-note">今日もおつかれさま。小小一步，也是很棒的一步。 <span>✿</span></footer>
      </main>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="手機導覽"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-layer" id="modal-layer"></div>
    <script type="module" src="/web/main.js"></script>
  </body>
</html>
